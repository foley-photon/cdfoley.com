# Refresh the Thermochemistry Lab's ATcT data (beta/thermochem/data/) from the ATcT API.
# _scripts/atct_sync.py asks /api/v1/all/ which Thermochemical Network version ATcT serves. A run with no new version
# makes exactly one request and changes nothing. A new version is fetched with ATcT's own Python client: the table and
# the covariances from that one version, at most one request every 4 s, about 1 900 requests in all (about 2 h 10 min). A probe request
# first checks that the covariances are of the new version; if they are not, the version is noted as pending in
# atct-current.json and later runs make 1 or 2 requests until ATcT's covariances catch up. Before anything reaches main,
# the page's self-test runs in Node on the new files; if it fails, the files go to a branch atct-tn<version> instead and
# the job fails. The responses of every run that fetched more than /all/ are kept as a workflow artifact
# (atct-raw-<run id>, with README.md and SHA256SUMS.txt) for the data archive. No secrets and no API key are used.
name: ATcT data sync

on:
  schedule:
    - cron: '17 7 * * 2'     # Tuesdays 07:17 UTC (off-peak in the US)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atct-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # a new version takes about 1 900 requests at 4 s, about 2 h 10 min; no new version, 1 request
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install the ATcT client
        # the versions of the 2026-11-10 build, so a rebuild from the same responses gives the same files
        run: pip install "atct==1.0.1" "httpx==0.28.1" "numpy==2.5.4"
      - name: Sync
        id: sync
        run: |
          set +e
          python _scripts/atct_sync.py --raw-dir "$RUNNER_TEMP/atct-raw"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # keep the raw responses when the run fetched more than /all/ (a new or pending version)
          if [ -f "$RUNNER_TEMP/atct-raw/requests.tsv" ] && [ "$(wc -l < "$RUNNER_TEMP/atct-raw/requests.tsv")" -gt 1 ]; then
            echo "archive=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$code" != 0 ] && [ "$code" != 4 ]; then exit "$code"; fi
          exit 0
      - name: Keep the raw API responses
        if: always() && steps.sync.outputs.archive == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: atct-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/atct-raw/
          retention-days: 90
      - name: Self-test the new data
        id: test
        run: |
          if [ -z "$(git status --porcelain -- beta/thermochem)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          T="$RUNNER_TEMP/tc"; mkdir -p "$T"; cp -r beta/thermochem/js "$T/js"; echo '{"type":"module"}' > "$T/package.json"
          cat > "$T/selftest-run.mjs" <<'EOF'
          // The page's self-test (js/selftest.js) on the data files atct-current.json names, as the browser runs it.
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const [jsDir, dataDir] = process.argv.slice(2);
          const E = await import(pathToFileURL(`${jsDir}/engine.js`).href);
          const T = await import(pathToFileURL(`${jsDir}/selftest.js`).href);
          const read = (f) => JSON.parse(fs.readFileSync(`${dataDir}/${f}`, 'utf8'));
          const cur = read('atct-current.json');
          const db = E.buildDB(read(cur.files.table)); db.isShipped = true;
          const covFile = read(cur.files.cov);
          const attached = !!E.attachCov(db, covFile);
          E.attachExcited(db, read('excited-states.json'));
          const all = [...T.CASES.map((c) => T.runCase(db, c)),
            ...T.extraChecks(db, { version: cur.version, covTN: covFile.tn_version, covError: attached ? null : 'refused by attachCov' })];
          const fails = all.filter((x) => x.pass === false);
          const na = all.filter((x) => x.pass === null);
          console.log(`TN ${cur.version}: ${all.length - fails.length - na.length} passed, ${fails.length} failed, ${na.length} not applicable`);
          for (const x of [...fails, ...na]) console.log(x.pass === false ? 'FAIL' : 'N/A ', x.id || x.title.replace(/<[^>]+>/g, ''), x.detail || '');
          process.exit(fails.length || !attached ? 1 : 0);
          EOF
          if node "$T/selftest-run.mjs" "$T/js" beta/thermochem/data; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Commit
        if: steps.test.outputs.changed == 'true'
        run: |
          VER=$(python -c "import json; c = json.load(open('beta/thermochem/data/atct-current.json')); print((c.get('pending') or {}).get('version') or c['version'])")
          PENDING=$(python -c "import json; print('yes' if 'pending' in json.load(open('beta/thermochem/data/atct-current.json')) else '')")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- beta/thermochem/data beta/thermochem/index.html
          if [ -n "$PENDING" ]; then
            git commit -m "Thermochemistry Lab: ATcT TN $VER pending (the API's covariances are not of that version yet)"
          else
            git commit -m "Thermochemistry Lab: ATcT TN $VER values and covariances from the ATcT API"
          fi
          if [ "${{ steps.test.outputs.ok }}" = "true" ]; then
            git pull --rebase origin main
            git push origin HEAD:main
          else
            # the self-test failed on the new files: keep them off the live page, on a branch for review
            git push --force origin "HEAD:refs/heads/atct-tn$VER"
            echo "::error::The self-test failed on ATcT TN $VER; the files are on branch atct-tn$VER, not on main."
            exit 1
          fi
      - name: Report a pending version
        if: steps.sync.outputs.code == '4'
        run: |
          echo "::error::ATcT serves a new TN version whose covariances are not of that version yet; see the pending note in beta/thermochem/data/atct-current.json."
          exit 1
