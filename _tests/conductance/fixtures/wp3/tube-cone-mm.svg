  <title>Tube and cone profile</title>
  <g transform="translate(10,50) scale(1,-1)" fill="none" stroke="#000" stroke-width="0.3">
    <polygon points="0,0 0,20 100,20 140,34.5588 140,0"/>
  </g>
  <text x="10" y="58">profile</text>
